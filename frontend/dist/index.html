<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TTD 업데이트</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="launcher">
    <header class="hero">
      <div class="brand">
        <img class="logo" src="logo.png" alt="TTD Updater" />
        <div>
          <div class="brand-name">Torchlight Tracker Diablo</div>
          <div class="brand-sub">업데이트 · 런처</div>
          <button type="button" class="link-chip hero-link" data-url="https://github.com/listil/ttd-updater/releases/latest">런처 최신 버전 다운로드</button>
        </div>
      </div>
      <div class="hero-right">
        <div class="theme-switch" id="themeSwitch" role="group" aria-label="테마">
          <button type="button" data-theme-value="">시스템</button>
          <button type="button" data-theme-value="light">라이트</button>
          <button type="button" data-theme-value="dark">다크</button>
        </div>
        <div class="versions">
          <span class="chip">현재 <b id="localVer">-</b></span>
          <span class="versions-arrow">→</span>
          <span class="chip chip-accent">최신 <b id="remoteVer">-</b></span>
        </div>
      </div>
    </header>

    <div class="body">
      <main class="notes-pane">
        <div class="pane-title">
          <span>업데이트 내역</span>
          <span id="notesBadge" class="pane-badge" hidden></span>
        </div>
        <div id="notes" class="notes">
          <div class="notes-empty">업데이트 내역을 불러오는 중...</div>
        </div>
        <nav class="links">
          <button type="button" class="link-chip" data-url="https://ttdiablo.com/">TTDiablo 공식 사이트</button>
          <button type="button" class="link-chip" id="driveLink">TTD 다운로드 (구글 드라이브)</button>
        </nav>
      </main>

      <aside class="side">
        <section class="card status-card">
          <div class="status-line">
            <span class="dot" id="statusDot"></span>
            <span id="headerText">TTD 업데이트 확인 중...</span>
          </div>
          <div class="progress"><div id="progressBar" class="progress-bar working"></div></div>
          <details id="logDetails" class="log-details">
            <summary>진행 로그</summary>
            <div id="log" class="log"></div>
          </details>
        </section>

        <section id="doneView" class="card options">
          <label class="row">
            <input type="checkbox" id="launchOnClose" />
            <span>종료 시 아래에서 선택한 항목 실행</span>
          </label>

          <div id="launchTargets" class="indent-block">
            <label class="row">
              <input type="checkbox" id="launchTTD" />
              <span>TTD</span>
            </label>

            <div class="row space-between">
              <label class="row">
                <input type="checkbox" id="launchGame" />
                <span>토치라이트</span>
              </label>
              <button id="gameSetupBtn" class="link-btn" type="button">실행 방식 설정</button>
            </div>
            <p id="gameMethodSummary" class="hint"></p>
          </div>

          <div id="gameSetupPanel" class="panel" hidden>
            <label class="radio-row">
              <input type="radio" name="method" id="methodSteam" value="steam" />
              Steam으로 실행
            </label>
            <div class="field indent">
              <label for="steamAppId">Steam App ID</label>
              <input type="text" id="steamAppId" placeholder="예: 123456" />
            </div>

            <label class="radio-row">
              <input type="radio" name="method" id="methodClient" value="client" />
              공식 클라이언트로 실행
            </label>
            <div class="field indent">
              <label for="clientExePath">실행 파일</label>
              <div class="row">
                <input type="text" id="clientExePath" readonly placeholder="파일을 선택하세요" />
                <button id="browseBtn" type="button">찾아보기...</button>
              </div>
            </div>

            <div class="panel-actions">
              <button id="gameSetupSave" class="primary" type="button">저장</button>
            </div>
          </div>

          <div class="section-divider"></div>
          <label class="row">
            <input type="checkbox" id="createShortcut" />
            <span>바탕화면에 TTD 바로가기 만들기</span>
          </label>

          <div id="selfUpdateSection" hidden>
            <div class="section-divider"></div>
            <label class="row">
              <input type="checkbox" id="installSelfUpdate" />
              <span id="selfUpdateLabel">종료 시 ttd_updater 새 버전 설치</span>
            </label>
          </div>
        </section>

        <div class="launch-area">
          <span id="waitingHint" class="hint">업데이트 확인이 끝나면 활성화됩니다...</span>
          <span id="autoCloseHint" class="hint" hidden></span>
          <button id="confirmBtn" class="launch-btn" type="button" disabled>닫기</button>
        </div>
      </aside>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
